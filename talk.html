<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body{
  padding:30px 20px;
  background: linear-gradient(135deg, #eef2f7 0%, #e4ecf5 100%);
  color:#222;
  max-width:600px;
  margin:0 auto;
  min-height:100vh;
  position: relative;
  overflow-x:hidden;
}
/* Dang 黑色加深30%，玻璃质感，下移20% */
.bg-logo{
  position:absolute;
  left:50%;
  top:calc(50% + 20%);
  transform:translate(-50%,-50%);
  font-size:120px;
  font-weight:700;
  color:rgba(0, 0, 0, 0.30);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  text-shadow: 0 0 10px rgba(0, 0, 0, 0.12);
  pointer-events:none;
  user-select:none;
}
.box{background:#fff;padding:28px 24px;border-radius:20px;box-shadow:0 4px 20px #00000010}
h2{font-size:24px;margin-bottom:8px;text-align:center}
.subtitle{text-align:center;color:#888;font-size:14px;margin-bottom:24px}
.info{color:#666;font-size:13px;margin-bottom:20px;line-height:1.6;background:#f8f8f8;padding:12px 16px;border-radius:10px}
.row{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;padding:14px 16px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:16px;outline:none;transition:border-color .2s}
input:focus{border-color:#007aff}
button{padding:14px 20px;border:none;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;transition:opacity .2s}
button:active{opacity:0.7}
button:disabled{background:#c7c7cc;cursor:not-allowed}
.primary{background:#007aff;color:#fff;width:100%}
.danger{background:#ff3b30;color:#fff;width:100%}
#status{margin-top:18px;padding:14px 16px;background:#f0f4f8;border-radius:12px;font-size:14px;line-height:1.5;min-height:48px;word-break:break-all}
.connected{background:#d4edda !important;color:#155724}
.error{background:#f8d7da !important;color:#721c24}
.waiting{background:#fff3cd !important;color:#856404}
</style>
</head>
<body>
<div class="bg-logo">Dang</div>
<div class="box">
  <h2>实时</h2>
  <div class="subtitle">实时</div>
  
  <div class="info">
    1. A先点【连接】，安静等待<br>
    2. B再点【连接】，B自动呼叫A<br>
    3. 此程序为私人制作，请勿转载使用，党伟制作！！！
    4. 如果被作者发现有人盗取，定追究法律责任！！！
  </div>
  <div class="row">
    <input id="roomInput" placeholder="输入房间号，如 8866">
    <button id="copyBtn" style="background:#e5e5ea;color:#333">复制</button>
  </div>
  
  <button id="connectBtn" class="primary">连接</button>
  <button id="disconnectBtn" class="danger" style="margin-top:10px" disabled>断开</button>
  
  <div id="status">⏳ 等待输入房间号</div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const roomInput = $('#roomInput');
const connectBtn = $('#connectBtn');
const disconnectBtn = $('#disconnectBtn');
const copyBtn = $('#copyBtn');
const statusBox = $('#status');
// 增加更多STUN服务器，提高穿透成功率
const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun.voipbuster.com' }
  ]
};
let peer, localStream, call, isConnected = false;
let callTimeout = null;

function setStatus(text, type = '') {
  statusBox.innerText = text;
  statusBox.className = type;
}
copyBtn.onclick = async () => {
  if (!roomInput.value.trim()) {
    setStatus('❌ 请先输入房间号', 'error');
    return;
  }
  try {
    await navigator.clipboard.writeText(roomInput.value.trim());
    setStatus('✅ 房间号已复制', 'connected');
  } catch(e) {
    roomInput.select();
    roomInput.setSelectionRange(0, 99999);
    setStatus('⚠️ 请长按手动复制房间号', 'waiting');
  }
};
disconnectBtn.onclick = () => {
  clearTimeout(callTimeout);
  if (call) { call.close(); call = null; }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  if (peer) { peer.destroy(); peer = null; }
  isConnected = false;
  connectBtn.disabled = false;
  disconnectBtn.disabled = true;
  roomInput.disabled = false;
  setStatus('✅ 已断开', 'waiting');
};
connectBtn.onclick = async () => {
  let roomId = roomInput.value.trim();
  if (!roomId) {
    setStatus('❌ 请输入房间号', 'error');
    return;
  }
  connectBtn.disabled = true;
  roomInput.disabled = true;
  setStatus('🎤 正在请求麦克风权限...', 'waiting');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ 
      audio: { echoCancellation: true, noiseSuppression: true },
      video: false 
    });
  } catch(err) {
    setStatus('❌ 麦克风权限被拒绝，请在浏览器设置中允许', 'error');
    connectBtn.disabled = false;
    roomInput.disabled = false;
    return;
  }
  setStatus('🔗 正在连接信号服务器...', 'waiting');
  peer = new Peer(roomId, { config: ICE_CONFIG, debug: 0 });
  // A：收到来电接听
  peer.on('call', incomingCall => {
    clearTimeout(callTimeout);
    setStatus('📞 收到来电，接听中...', 'waiting');
    call = incomingCall;
    call.answer(localStream);
    
    call.on('stream', remoteStream => {
      playRemoteAudio(remoteStream);
      isConnected = true;
      setStatus('✅✅ 连接成功，可以说话！', 'connected');
      disconnectBtn.disabled = false;
    });
    call.on('close', () => {
      setStatus('📵 对方已挂断', 'waiting');
      disconnectBtn.click();
    });
    call.on('error', e => {
      setStatus('❌ 通话协商失败（NAT限制），建议同一WiFi', 'error');
    });
  });
  peer.on('open', () => {
    setStatus('⏳ 已就绪，等待对方加入...', 'waiting');
  });
  peer.on('error', err => {
    console.error('Peer error:', err);
    if (err.type === 'unavailable-id') {
      setStatus('📞 房间已存在，正在呼叫A...', 'waiting');
      const tempPeer = new Peer({ config: ICE_CONFIG, debug: 0 });
      peer = tempPeer;
      tempPeer.on('open', () => {
        call = tempPeer.call(roomId, localStream);
        // 呼叫超时12秒自动失败，防止一直卡着
        callTimeout = setTimeout(()=>{
          if(!isConnected){
            setStatus('❌ 呼叫超时，穿透失败，优先同WiFi测试', 'error');
            disconnectBtn.click();
          }
        },12000);
        call.on('stream', remoteStream => {
          clearTimeout(callTimeout);
          playRemoteAudio(remoteStream);
          isConnected = true;
          setStatus('✅✅ 连接成功，可以说话！', 'connected');
          disconnectBtn.disabled = false;
        });
        call.on('close', () => {
          setStatus('📵 对方挂断', 'waiting');
          disconnectBtn.click();
        });
        call.on('error', e => {
          clearTimeout(callTimeout);
          setStatus('❌ 呼叫失败：网络NAT不通，建议同一WiFi', 'error');
        });
      });
      tempPeer.on('error', e => {
        setStatus('❌ 信号错误：' + e.type, 'error');
      });
    } else if (err.type === 'network' || err.type === 'server-unavailable') {
      setStatus('❌ 信号服务器连不上，请检查网络，优先同WiFi', 'error');
      connectBtn.disabled = false;
      roomInput.disabled = false;
      disconnectBtn.disabled = true;
      if (peer) peer.destroy();
    } else {
      setStatus('❌ 错误：' + err.type, 'error');
      connectBtn.disabled = false;
      roomInput.disabled = false;
      disconnectBtn.disabled = true;
      if (peer) peer.destroy();
    }
  });
  disconnectBtn.disabled = false;
};
function playRemoteAudio(stream) {
  const audio = new Audio();
  audio.srcObject = stream;
  audio.autoplay = true;
  audio.play().catch(e => console.log('音频播放失败:', e));
}
</script>
</body>
</html>
